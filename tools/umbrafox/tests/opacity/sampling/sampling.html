<!doctype html>
<meta charset="utf-8">
<title>Opacity oracle loading</title>
<style>
  html, body { margin: 0; width: 100%; height: 100%; background: #35718d; }
  canvas { position: fixed; left: 16px; top: 24px; width: 643px; height: 367px; opacity: .25; }
  .odd-double canvas { width: 642px; height: 362px; }
  .odd-nearest canvas { image-rendering: pixelated; }
</style>
<div id="group"><canvas width="320" height="180"></canvas></div>
<script>
  'use strict';
  const scenario = new URL(location.href).searchParams.get('case');
  if (!['odd-double', 'even-odd', 'odd-nearest'].includes(scenario)) {
    throw new Error('Unknown sampling diagnostic');
  }
  document.documentElement.className = scenario;
  const canvas = document.querySelector('canvas');
  if (scenario !== 'even-odd') {
    canvas.width = 321;
    canvas.height = 181;
  }
  const context = canvas.getContext('2d');
  const pixels = context.createImageData(canvas.width, canvas.height);
  for (let y = 0; y < canvas.height; y++) {
    for (let x = 0; x < canvas.width; x++) {
      const index = (y * canvas.width + x) * 4;
      pixels.data[index] = (x * 7 + y * 3) % 256;
      pixels.data[index + 1] = (x * 3 + y * 13) % 256;
      pixels.data[index + 2] = (x * 11 + y * 5) % 256;
      pixels.data[index + 3] = x < canvas.width / 2 ? 255 : (x + y) % 256;
    }
  }
  let frames = 0;
  function draw() {
    context.putImageData(pixels, 0, 0);
    if (++frames < 90) {
      requestAnimationFrame(draw);
      return;
    }
    let hash = 2166136261;
    const readback = context.getImageData(0, 0, canvas.width, canvas.height).data;
    for (const byte of readback) hash = Math.imul(hash ^ byte, 16777619) >>> 0;
    document.title = `Opacity oracle ready ${hash.toString(16)}`;
  }
  draw();
</script>
