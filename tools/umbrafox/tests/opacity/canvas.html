<!doctype html>
<meta charset="utf-8">
<title>Opacity oracle loading</title>
<style>
  html, body { margin: 0; width: 100%; height: 100%; background: #35718d; }
  canvas { position: fixed; inset: 0; width: 100%; height: 100%; opacity: .25; pointer-events: none; }
</style>
<canvas width="320" height="180"></canvas>
<script>
  'use strict';
  const canvas = document.querySelector('canvas');
  const context = canvas.getContext('2d');
  const pixels = context.createImageData(320, 180);
  for (let y = 0; y < 180; y++) {
    for (let x = 0; x < 320; x++) {
      const index = (y * 320 + x) * 4;
      pixels.data[index] = (x * 7 + y * 3) % 256;
      pixels.data[index + 1] = (x * 3 + y * 13) % 256;
      pixels.data[index + 2] = (x * 11 + y * 5) % 256;
      pixels.data[index + 3] = x < 160 ? 255 : (x + y) % 256;
    }
  }
  let frames = 0;
  function draw() {
    context.putImageData(pixels, 0, 0);
    if (++frames < 90) {
      requestAnimationFrame(draw);
      return;
    }
    const readback = context.getImageData(0, 0, 320, 180).data;
    let hash = 2166136261;
    for (const byte of readback) hash = Math.imul(hash ^ byte, 16777619) >>> 0;
    document.title = `Opacity oracle ready ${hash.toString(16)}`;
  }
  draw();
</script>
